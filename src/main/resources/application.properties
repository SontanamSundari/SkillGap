
spring.application.name=skillgap-backend

server.port=8080
# spring.mongodb.uri=mongodb://localhost:27017/skillgap
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/skillgap}

# Groq - assessment question generation
groq.api.key=${GROQ_API_KEY}
groq.model=openai/gpt-oss-20b

# Legacy AI configuration
# ai.api.key=${GEMINI_API_KEY:}
ai.api.key=${GROQ_API_KEY:}
ai.model=unused
ai.provider=unused

# OpenRouter - retained temporarily for other existing services
openrouter.api.key=${OPENROUTER_API_KEY:}
openrouter.model=nvidia/nemotron-3.5-lightning:free

# logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security=INFO
